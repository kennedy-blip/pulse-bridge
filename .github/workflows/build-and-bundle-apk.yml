name: Build Android APK and web bundle
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/23234159-pulse-bridge]
    tags: ['v*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci && npm test && npm run build
      - run: npx cap add android
      - name: Add Android media permissions and sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          data = p.read_text()
          for permission in ['CAMERA', 'RECORD_AUDIO', 'VIBRATE']:
              if f'android.permission.{permission}' not in data:
                  data = data.replace('</manifest>', f'    <uses-permission android:name="android.permission.{permission}" />\n</manifest>')
          p.write_text(data)
          PY
          npx cap sync android
      - name: Build installable debug-signed APK
        working-directory: android
        run: bash gradlew assembleDebug
      - name: Verify APK signature and bundled app
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/index.html | grep -q PulseBridge
      - name: Bundle APK and release metadata
        run: |
          mkdir -p public/releases
          cp android/app/build/outputs/apk/debug/app-debug.apk public/releases/pulsebridge-release.apk
          hash=$(sha256sum public/releases/pulsebridge-release.apk | cut -d' ' -f1)
          printf '{"sha256":"%s","signing":"debug"}\n' "$hash" > public/releases/pulsebridge-release.json
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pulsebridge-web-with-apk
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pulsebridge-android
          path: public/releases/
      - name: Stage verified APK for the web deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/23234159-pulse-bridge'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/releases/pulsebridge-release.apk public/releases/pulsebridge-release.json
          git commit -m 'Bundle verified Android APK for one-tap download'
          git push origin HEAD:refs/heads/arena/23234159-pulse-bridge
